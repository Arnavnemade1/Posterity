name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      # Public placeholders: the build only needs well-formed values, never real credentials.
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      NEXT_PUBLIC_POSTERITY_API: https://example.supabase.co/functions/v1/api
      NEXT_PUBLIC_SITE_URL: https://posterity.example
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      # Validate the lock with the npm that writes it. npm 11 leaves the optional @emnapi
      # peers of the WebAssembly fallbacks out of package-lock.json; npm 10 and 12 require
      # them, so their `npm ci` rejects a lock npm 11 wrote.
      - run: npm install --global npm@11.6.2
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - uses: oven-sh/setup-bun@v2
      - run: bun test ../scripts/tests

  packages:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dir: [packages/sdk, packages/cli, examples/claude-agent]
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install
        run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test

  edge-function:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check --no-lock --node-modules-dir=none supabase/functions/api/index.ts
      # The GitHub sync against an in-memory GitHub and workspace.
      - run: deno test --no-lock --node-modules-dir=none --allow-env supabase/functions/tests/

  collaboration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0
          github-token: ${{ github.token }}
      - name: Rebuild the database from migrations
        run: supabase start -x studio,imgproxy,storage-api,realtime,mailpit,logflare,vector,supavisor
      - name: Verify historical engine invariants
        run: bun scripts/e2e/local-invariants.ts
      - name: Verify ensemble protocol and native adapters
        run: bun scripts/e2e/phase13.ts
      - name: Verify advisory orchestration and audit boundaries
        run: bun scripts/e2e/phase14.ts
      - name: Verify fleet concurrency and the complete heartbeat API
        run: POSTERITY_LOAD_HTTP=1 bun scripts/e2e/fleet-concurrency.ts
      - name: Capture collaboration failure diagnostics
        if: failure()
        run: |
          docker logs --since 3m --tail 200 supabase_edge_runtime_posterity 2>&1
          docker logs --since 3m supabase_db_posterity 2>&1 | rg -A8 -B2 'ERROR|deadlock' || true
      - name: Stop local services
        if: always()
        run: supabase stop
