name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      # Public placeholders: the build only needs well-formed values, never real credentials.
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      NEXT_PUBLIC_POSTERITY_API: https://example.supabase.co/functions/v1/api
      NEXT_PUBLIC_SITE_URL: https://posterity.example
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      # Validate the lock with the npm that writes it. npm 11 leaves the optional @emnapi
      # peers of the WebAssembly fallbacks out of package-lock.json; npm 10 and 12 require
      # them, so their `npm ci` rejects a lock npm 11 wrote.
      - run: npm install --global npm@11.6.2
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

  packages:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dir: [packages/sdk, packages/cli, examples/claude-agent]
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install
        run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test

  edge-function:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check --no-lock --node-modules-dir=none supabase/functions/api/index.ts
      # The GitHub sync against an in-memory GitHub and workspace.
      - run: deno test --no-lock --node-modules-dir=none --allow-env supabase/functions/tests/
